<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Roadmap</title>
    <script>
      // Тема применяется до отрисовки, чтобы страница не мигала
      (function () {
        var theme = 'dark';
        try {
          var ui = JSON.parse(localStorage.getItem('nastya-roadmap-ui')) || {};
          theme = ui.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="stylesheet" href="styles.css?v=3">
</head>
<body class="page-roadmap">
    <a class="skip-link" href="#main">К содержимому</a>

    <header class="topbar">
        <button class="icon-btn menu-btn" id="ui-menu" type="button" aria-label="Открыть меню разделов">
            <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 4.5h14M2 9h14M2 13.5h14"/></svg>
        </button>
        <a class="brand" href="index.html">Frontend Roadmap</a>
        <nav class="tabs" aria-label="Страницы">
            <a class="tab" href="index.html" aria-current="page">Роадмап</a>
            <a class="tab" href="lab.html">Mega Lab</a>
        </nav>
        <div class="top-progress" title="Общий прогресс на этой странице">
            <span class="bar"><span class="bar-fill"></span></span>
            <span class="top-progress-text" id="ui-progress-text"></span>
        </div>
        <button class="icon-btn" id="ui-theme" type="button" aria-label="Переключить светлую и тёмную тему">
            <svg class="icon-sun" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="9" r="3.2"/><path d="M9 1.5v2M9 14.5v2M1.5 9h2M14.5 9h2M3.7 3.7l1.4 1.4M12.9 12.9l1.4 1.4M3.7 14.3l1.4-1.4M12.9 5.1l1.4-1.4"/></svg>
            <svg class="icon-moon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M15.5 10.6A6.8 6.8 0 0 1 7.4 2.5a6.8 6.8 0 1 0 8.1 8.1z"/></svg>
        </button>
    </header>

    <div class="layout">
        <aside class="sidebar" id="sidebar">
            <nav class="nav-scroll" aria-label="Разделы">
                <ul id="ui-nav"></ul>
            </nav>
            <div class="sidebar-foot">
                <button class="text-btn" id="ui-export" type="button" title="Сохранить все галочки в файл">Экспорт</button>
                <button class="text-btn" id="ui-import" type="button" title="Загрузить галочки из файла">Импорт</button>
                <input id="ui-import-file" type="file" accept="application/json,.json" hidden>
            </div>
        </aside>
        <div class="overlay" id="ui-overlay"></div>

        <main class="main" id="main">
            <div id="ui-news"></div>
            <div class="intro">
                <h1>Frontend Developer Roadmap</h1>
                <p>Что должен знать фронтендер, который найдёт работу где угодно. Ставь галочку, когда можешь объяснить тему вслух и ответить на вопросы из «Проверь себя».</p>
            </div>
            <div id="ui-continue"></div>
            <div class="toolbar">
                <input class="search" id="ui-search" type="search" placeholder="Поиск по темам ( / )" aria-label="Поиск по темам" autocomplete="off">
                <button class="chip-btn" id="ui-hide-done" type="button" aria-pressed="false">Скрыть выполненное</button>
                <button class="chip-btn" id="ui-expand" type="button">Развернуть всё</button>
                <button class="chip-btn" id="ui-collapse" type="button">Свернуть всё</button>
                <button class="chip-btn" id="ui-news-btn" type="button" hidden>Что нового</button>
            </div>
            <div id="ui-content"></div>
            <p class="empty" id="ui-empty" hidden>Ничего не найдено. Попробуй другое слово.</p>
        </main>
    </div>

    <script src="data.js?v=3"></script>
    <script src="checks.js?v=3"></script>
    <script src="common.js?v=3"></script>
    <script src="app.js?v=3"></script>
</body>
</html>
